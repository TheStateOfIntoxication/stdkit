# stdkit 自身门禁：规则仓自检 + 确定性层回归 + 纯函数单测 + 跨平台冒烟
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 规则仓自检（ID/引用/catalog/dist/版本/格式覆盖/prompt 一致性/README 数字）
        run: node cli/ds.mjs check
      - name: 确定性层回归（行级 + 仓级）
        run: node cli/ds.mjs eval
      - name: 单测（含护栏、剥离器矩阵、install/publish/cross）
        run: node --test cli/lib/*.test.mjs

  # Windows 单独一条：路径分隔符、install.ps1、CRLF 相关分支只有这里能覆盖
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 自检 + 单测
        run: |
          node cli/ds.mjs check
          node --test cli/lib/*.test.mjs
      - name: 安装脚本 dry-run（不落盘）
        run: node cli/ds.mjs install --all --dry-run
      - name: PowerShell shim 可解析
        shell: pwsh
        run: ./install.ps1 -All -DryRun

  # 只在打 tag（准备发布）时跑脱敏检查，日常开发不做噪音
  publish-check:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 发布前脱敏（含 dist/，即真正会发布的内容）
        run: node cli/ds.mjs publish-check
      - name: 历史脱敏（force-push 不删对象，工作树干净不代表历史干净）
        run: node cli/ds.mjs publish-check --history
